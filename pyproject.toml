[project]
name = "onebigjump"
version = "0.1.0"
description = "Heavy tails in residual-stream reasoning trajectories: an order parameter for algorithmic computation (experimental pipeline)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "Anonymous (ICLR 2027 submission)" }]
# License intentionally unspecified until the paper is public. Repository is private.

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "joblib>=1.3",
    "orjson>=3.9",
    "psutil>=5.9",
    "filelock>=3.13",
]

[project.optional-dependencies]
stats = [
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]
viz = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
ml = [
    "torch>=2.2",
    "transformers>=4.40",
    "accelerate>=0.29",
    "datasets>=2.19",
    "tokenizers>=0.19",
    "safetensors>=0.4",
    "huggingface-hub>=0.23",
    "sentencepiece>=0.2",
    "einops>=0.7",
    "tensorboard>=2.16",
]
# Only installable on Linux+CUDA. Deliberately not part of `--all-extras`
# on this machine; see docs/system_report.md.
inference = [
    "vllm>=0.4; sys_platform == 'linux'",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
    "mypy>=1.9",
    "pre-commit>=3.7",
    "types-PyYAML",
    "pandas-stubs",
]

[project.scripts]
onebigjump = "onebigjump.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onebigjump"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["lean_workspace"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "NPY"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
disallow_untyped_defs = false
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests",
    "lean: requires a working Lean 4 + Mathlib toolchain",
    "ml: requires torch and a downloaded model",
    "net: requires network access",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/onebigjump"]
branch = true
