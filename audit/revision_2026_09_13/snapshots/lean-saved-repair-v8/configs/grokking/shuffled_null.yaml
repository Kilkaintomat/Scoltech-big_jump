# P4's null: the same training run with nothing to learn.
#
# What P4 now claims, after the transient peak was withdrawn as an MPS artefact, is that the tail
# index declines monotonically through training -- read as the network acquiring algorithmic
# structure. The competing explanation is that it would decline in any long optimisation run,
# because weights grow and activations settle, with no circuit involved.
#
# This config separates them. The labels are a fixed random permutation of the real ones, so
# memorisation is still possible and generalisation is not: test accuracy stays at chance and the
# progress measures never turn. Everything else -- architecture, optimiser, schedule, seeds,
# checkpoint spacing, tail settings -- is identical to modular_addition.yaml, because a null that
# differs in two ways answers nothing.
#
# Read the result as: if rho(step, xi) here is as negative as in the real run, P4's surviving
# claim is about optimisation, not about algorithms, and should be dropped too.
name: p4-grokking-shuffled-null
kind: grokking
description: >-
  Track gamma_hat of the depth-wise step deviations across the grokking transition of the
  modular-addition transformer of Nanda et al. (2023), against the restricted and excluded
  progress measures.
seed: 0

grokking:
  p: 113
  d_model: 128
  n_heads: 4
  n_layers: 1
  d_mlp: 512
  lr: 1.0e-3
  weight_decay: 1.0
  betas: [0.9, 0.98]
  train_frac: 0.3
  shuffle_labels: true   # the whole point of this config
  steps: 40000
  checkpoint_every: 100
  seeds: [0, 1, 2]
  device: auto
  out_dir: results/full/grokking_null
  tail:
    k_min: 20
    k_max_frac: 0.25
    k_selector: double_bootstrap
    double_bootstrap_resamples: 200
    bootstrap_resamples: 500
    bootstrap_unit: trace   # one deviation per input, so inputs are the units
    ci_level: 0.95
    estimators: [hill, moment, gpd]
